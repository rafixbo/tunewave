name: Build TuneWave APK

# TuneWave v1 — Kotlin / Jetpack Compose / Material 3 Expressive.
# Builds the RELEASE APK on GitHub-hosted runners (primary build route).
# No keystore is committed, ever: CI generates a fresh debug keystore
# each run and signs the APK with it (an UNSIGNED APK cannot be
# installed on Android at all). The cert therefore changes on every
# build — uninstall the previous build before installing a new one.
# No secrets are needed for this build — there is no backend, no API
# key, no login.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android action: it runs `sdkmanager tools`, a package
      # Google removed, and fails the whole job. ubuntu-latest already
      # ships the SDK at $ANDROID_HOME — install API 36 directly.
      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # No gradlew / wrapper jar in the repo (connector push is text-only),
      # so Gradle is installed by the setup-gradle action itself.
      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.12"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign APK with fresh debug keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/tunewave-debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TuneWave Debug,O=TuneWave,C=BD"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/tunewave-debug.keystore --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tunewave-v1-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
